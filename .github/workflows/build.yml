# Builds the tagged source and runs the project's checks, so anyone can see that a release's
# source builds and passes. It publishes nothing and uses no secrets: the APK that people install
# is signed with a key that never leaves my machine.
name: Build

on:
  push:
    tags:
      - "v*"
  # Started by hand from the Actions tab, for a tag whose push GitHub did not report.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Its default package list includes "tools", which the SDK no longer has, so name ours.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Build and check
        run: bash scripts/verify.sh --ci
