# Builds the tagged source and runs the project's checks, so anyone can see that a release's
# source builds and passes. It publishes nothing and uses no secrets: the APK that people install
# is signed with a key that never leaves my machine.
name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the Android platform and build tools the project uses
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build and check
        run: bash scripts/verify.sh --ci
